# =================================
# Application Configuration
# =================================

# Application URL
URL=https://opensource-demo.orangehrmlive.com/web/index.php/auth/login

# =================================
# Browser Configuration
# =================================

# Browser: chromium, firefox, webkit, chrome, edge
browser=firefox

# Headless mode
headless=false

# Slow motion (ms) - for debugging
slowMo=500

# =================================
# Parallel Execution
# =================================

thread.count=3

# =================================
# Timeouts (milliseconds)
# =================================

navigation.timeout=30000
action.timeout=60000

# =================================
# Screenshot Configuration
# =================================

screenshot.on.failure=true
screenshot.directory=src/test/test-output/Screenshots

# =================================
# Video Recording
# =================================

video.recording=true
video.directory=src/test/test-output/Video

# =================================
# Trace Configuration
# =================================

trace.on.failure=true
trace.directory=src/test/test-output/Traces

# =================================
# Storage State (Authentication)
# =================================

storage.state.path=src/test/test-output/storage-states/

# =================================
# Test Data
# =================================

test.username=Admin
test.password=admin123